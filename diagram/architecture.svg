<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00E5C8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8892A4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#0A0F1E"/>

  <text x="30" y="40" fill="#FFFFFF" font-size="20" font-weight="600">AgencyGym — Architecture</text>
  <text x="30" y="62" fill="#8892A4" font-size="13">Task Intent is fixed. AgencyGym places a known capability and runs the agent blind. AgencyScore is what AgencyGym produces — not a separate number it checks.</text>

  <rect x="380" y="100" width="240" height="60" rx="8" fill="#0A0F1E" stroke="#00E5C8" stroke-width="2"/>
  <text x="500" y="126" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Task Intent</text>
  <text x="500" y="145" fill="#8892A4" font-size="11" text-anchor="middle">declared, fixed — the ruler, not a surface</text>

  <rect x="120" y="220" width="320" height="90" rx="8" fill="#0A0F1E" stroke="#2D6FE8" stroke-width="2"/>
  <text x="280" y="248" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Tool Surface</text>
  <text x="280" y="268" fill="#8892A4" font-size="11" text-anchor="middle">connectivity + capability</text>
  <text x="280" y="286" fill="#8892A4" font-size="11" text-anchor="middle">found in a registry — declared</text>

  <rect x="560" y="220" width="320" height="90" rx="8" fill="#0A0F1E" stroke="#2D6FE8" stroke-width="2"/>
  <text x="720" y="248" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Infrastructure Surface</text>
  <text x="720" y="268" fill="#8892A4" font-size="11" text-anchor="middle">shared runtime — IAM, containers, gateways</text>
  <text x="720" y="286" fill="#8892A4" font-size="11" text-anchor="middle">no registry entry — declared or not</text>

  <path d="M 460 160 L 300 220" stroke="#8892A4" stroke-width="1.5" fill="none" marker-end="url(#arrowMuted)"/>
  <path d="M 540 160 L 700 220" stroke="#8892A4" stroke-width="1.5" fill="none" marker-end="url(#arrowMuted)"/>

  <rect x="340" y="345" width="320" height="55" rx="8" fill="#0A0F1E" stroke="#8892A4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="368" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">One known capability placed</text>
  <text x="500" y="386" fill="#8892A4" font-size="11" text-anchor="middle">a fixed location, direct or transitive — set by the task author</text>

  <path d="M 280 310 L 460 345" stroke="#8892A4" stroke-width="1.5" fill="none" marker-end="url(#arrowMuted)"/>
  <path d="M 720 310 L 540 345" stroke="#8892A4" stroke-width="1.5" fill="none" marker-end="url(#arrowMuted)"/>

  <rect x="280" y="435" width="440" height="100" rx="8" fill="#0A0F1E" stroke="#2D6FE8" stroke-width="2.5"/>
  <text x="500" y="462" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">AgencyGym Sandbox</text>
  <text x="500" y="482" fill="#8892A4" font-size="11" text-anchor="middle">agent runs blind to the placement, N times</text>
  <text x="500" y="500" fill="#8892A4" font-size="11" text-anchor="middle">each run: did it call beyond expected_tools?</text>
  <text x="500" y="518" fill="#8892A4" font-size="11" text-anchor="middle">did it acquire the placed capability?</text>

  <path d="M 500 400 L 500 435" stroke="#8892A4" stroke-width="1.5" fill="none" marker-end="url(#arrowMuted)"/>

  <rect x="320" y="575" width="360" height="75" rx="8" fill="#0A0F1E" stroke="#00E5C8" stroke-width="2.5"/>
  <text x="500" y="602" fill="#00E5C8" font-size="15" font-weight="700" text-anchor="middle">AgencyScore</text>
  <text x="500" y="622" fill="#8892A4" font-size="11" text-anchor="middle">(runs that acquired it) / N — per risk_basis dimension</text>
  <text x="500" y="639" fill="#8892A4" font-size="11" text-anchor="middle">the output of the sandbox, not a separate pre-computed number</text>

  <path d="M 500 535 L 500 575" stroke="#00E5C8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="560" fill="#00E5C8" font-size="10">produces</text>

  <rect x="740" y="575" width="220" height="60" rx="8" fill="#0A0F1E" stroke="#8892A4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="850" y="601" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Tighten deployment</text>
  <text x="850" y="619" fill="#8892A4" font-size="10" text-anchor="middle">remove excess, add a gate</text>

  <path d="M 680 605 L 740 605" stroke="#8892A4" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
  <path d="M 850 575 L 850 500 L 720 500" stroke="#8892A4" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
  <text x="730" y="493" fill="#8892A4" font-size="10">re-run through AgencyGym</text>

  <text x="30" y="700" fill="#8892A4" font-size="10">Dashed loop = the crash-test cycle: score comes back high → tighten → re-run → deploy.</text>
  <text x="30" y="718" fill="#8892A4" font-size="10">There is no version of AgencyScore computed before the sandbox runs.</text>
</svg>
